:root{--mark:#FFD84D;--acc:#2556D6;--tint:#FFF3EE}

/* works */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:30px 0 24px}
.filters button{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:15px;color:var(--muted);transition:.2s}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;align-items:start;grid-auto-flow:row dense}
.card{min-width:0;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-align:left;cursor:pointer;padding:0;transition:transform .25s,box-shadow .25s}

.calc .chk input{width:20px;height:20px;accent-color:var(--rec)}
.calc .chk span small{color:var(--muted);display:block;font-size:13px}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 16px}
.total b{font-family:var(--disp);font-size:34px;letter-spacing:-.02em}
.calc .note{font-size:13px;color:var(--muted);margin-top:12px}
.plan{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:-6px 0 16px;font-size:15px}
.plan .ptitle{font-weight:600}
.plan .pmeta{color:var(--muted);font-size:14px;margin-top:2px}
.plan .pmeta b{color:var(--ink)}
.plan .pk{font-size:13px;color:var(--muted);margin-top:12px}
.plan ol{margin:6px 0 0 20px;display:grid;gap:4px}
.plan .tl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.plan .tl span{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.plan .tl span:last-child{border-color:var(--rec);color:var(--rec)}

/* process */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:40px;border-top:2px solid var(--ink)}
.step{padding:22px 20px 0 0;position:relative}
.step::before{content:"";position:absolute;top:-8px;left:0;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.step:first-child::before{background:var(--rec);border-color:var(--rec)}
.step .n{font-family:var(--disp);font-size:14px;color:var(--muted)}
.step h3{font-family:var(--body);font-size:18px;font-weight:600;letter-spacing:0;margin:6px 0}
.step p{color:var(--muted);font-size:15px}
.rule{margin-top:40px;background:color-mix(in srgb,var(--rec) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--rec) 30%,var(--line));border-radius:20px;padding:24px 28px;display:flex;gap:18px}
.rule svg{flex:none;width:28px;height:28px;color:var(--rec)}
.rule h3{font-family:var(--body);font-size:18px;font-weight:600;letter-spacing:0;margin-bottom:4px}
.rule p{color:var(--muted)}

/* faq */
.faq{max-width:820px;margin-top:28px}
details{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:20px 44px 20px 0;font-weight:600;font-size:18px;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"";position:absolute;right:8px;top:50%;width:12px;height:12px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);transition:transform .25s}
details[open] summary::after{transform:translateY(-30%) rotate(-135deg)}
details p{color:var(--muted);padding:0 0 20px;max-width:68ch}

/* contact */
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:48px;box-shadow:var(--shadow)}
.contact .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.vcard{display:flex;gap:18px;align-items:center;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
#qr{width:104px;height:104px;background:#fff;padding:6px;border-radius:12px;flex:none}
#qr img,#qr canvas{width:100%!important;height:100%!important}
.vcard p{font-size:14px;color:var(--muted)}
.vcard a{font-weight:600}
form{display:grid;gap:14px;align-content:start}
form label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
form input,form select,form textarea{font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);width:100%}
form textarea{min-height:110px;resize:vertical}
form input:focus,form select:focus,form textarea:focus{outline:none;border-color:var(--blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fnote{font-size:13px;color:var(--muted)}

footer{padding:40px 0 70px;color:var(--muted);font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;border-top:1px solid var(--line);padding-top:24px}
footer a{color:var(--muted)}

.bbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bbar .btn{padding:13px 14px;font-size:15px}
.bbar .btn-wa{flex:2}.bbar .btn-line{flex:1}

/* player */
dialog{border:0;padding:0;background:transparent;max-width:min(92vw,980px);max-height:92vh;margin:auto}
dialog::backdrop{background:rgba(10,10,12,.82);backdrop-filter:blur(4px)}
.pl{position:relative;background:#000;border-radius:16px;overflow:hidden}
.pl video,.pl iframe{display:block;max-height:86vh;max-width:min(92vw,980px);width:100%;border:0}
.pl.v video,.pl.v iframe{width:auto;height:86vh;aspect-ratio:9/16;max-width:92vw}
.pl.h iframe{aspect-ratio:16/9;height:auto}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111;cursor:pointer;font-size:22px;line-height:1;z-index:2}

@media (max-width:1040px){
  nav.main{display:none}
  .tools{margin-left:auto}
  .burger{display:grid}
  .hdr .btn-wa{display:none}
  .mnav.open{display:grid;padding:6px 22px 18px;border-top:1px solid var(--line);background:var(--paper)}
  .mnav a{padding:13px 0;font-size:18px;text-decoration:none;border-bottom:1px solid var(--line)}
  .hero-top{grid-template-columns:1fr}
  .dir{grid-template-columns:60px 1fr;gap:16px 18px}
  .dir .tags,.dir .go,.dir .side{grid-column:2}
  .dir{grid-template-columns:52px minmax(0,1fr);padding:20px 18px;border-radius:20px}
  .dir .ic{width:52px;height:52px;border-radius:15px;align-self:start}
  .dir .side{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ba-wrap,.price,.contact{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;border-top:0;border-left:2px solid var(--ink);margin-left:6px}
  .step{padding:0 0 24px 24px}
  .step::before{top:2px;left:-8px}
  .bbar{display:flex}
  body{padding-bottom:72px}
  .pick{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (hover:none){#qr,.qrhint{display:none}}
@media (max-width:600px){
  body{font-size:16px}
  section{padding:64px 0}
  .hero{padding-top:36px}
  .hero-row .btn{flex:1 1 100%}
  .pick{gap:8px}.pick a{padding:12px 12px 10px}.pick b{font-size:15px}.pick span{font-size:13px}
  .dir .side{align-items:stretch}.dir .want{flex:1 1 100%}
  .facts{gap:18px}
  .frame{height:230px}
  .grid{gap:12px}
  .card .meta{padding:10px 12px 12px}
  .card h3{font-size:14px}
  .card .d{display:none}
  .ask{grid-column:span 2;min-height:0}
  .contact{padding:26px 18px;border-radius:22px}
  .two{grid-template-columns:1fr}
  .pbox{padding:24px 20px}

  .seg button{padding:6px 7px}
  .hdr{gap:10px}
  .tools{gap:6px;margin-left:auto}
  .icon-btn{width:36px;height:36px}
}
@media (max-width:380px){.logo{font-size:17px}.seg button{padding:5px 6px;font-size:12px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

/* ---------- player ---------- */
const dlg = $("#player"), pl = $("#pl");
function play(w){
  pl.querySelectorAll("video,iframe,.want").forEach(n => n.remove());
  pl.className = "pl " + (w.v ? "v" : "h");
  if (w.t){ const a = document.createElement("a"); a.className = "btn btn-wa want"; a.target = "_blank"; a.rel = "noopener"; a.textContent = t("want"); a.href = wa(t("want.msg") + "«" + (w.t[lang]||w.t.ru) + "»"); pl.appendChild(a); }
  if (w.yt && !CAN_EMBED){ openExt("https://youtu.be/" + w.yt); return; }
  let el;
  if (w.yt){ el = document.createElement("iframe"); el.src = "https://www.youtube-nocookie.com/embed/" + w.yt + "?autoplay=1&rel=0"; el.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; el.allowFullscreen = true; }
  else { el = document.createElement("video"); el.src = w.file; el.controls = true; el.autoplay = true; el.playsInline = true; el.poster = w.poster; }
  pl.appendChild(el);
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open","");
}
function closePlayer(){ pl.querySelectorAll("video,iframe").forEach(n => n.remove()); dlg.close ? dlg.close() : dlg.removeAttribute("open"); }

}

function buildWorks(){

  const g = $("#grid"); g.innerHTML = "";

    const v = c.querySelector("video");
    const start = () => { if(!v.src) v.src = v.dataset.src; v.play().catch(()=>{}); };
    const stop = () => { v.pause(); };
    c.addEventListener("mouseenter", start); c.addEventListener("mouseleave", stop);
    c.addEventListener("focus", start); c.addEventListener("blur", stop);
    c.addEventListener("click", () => play(w));
    c._start = start; c._stop = stop;
    g.appendChild(c);
  });
  ["memory","edu"].forEach(s => {

    const a = document.createElement("div"); a.className = "ask"; a.style.setProperty("--c", SEGC[s]);

  }
}

/* ---------- план проекта в калькуляторе ----------
   Лабораторная №10: if/else, switch, for, while, функции с параметрами и return, стрелочные функции */

// Обычная функция с параметрами и return: название проекта
function getProjectTitle(typeName, minutes) {
  return typeName + " · " + minutes + " " + t("plan.min");
}

// Стрелочная функция: сколько этапов в списке
const getStepCount = (stepList) => {
  return stepList.length;
};

// Стрелочная функция: секунды -> "1:05"
const toTime = (sec) => Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");

// switch: по типу видео выбираем ключ этапов и шаг таймлайна (в секундах)
function getVideoPlan(typeIndex) {
  let key, step;
  switch (typeIndex) {
    case 0: key = "ads";    step = 15; break;  // реклама — короткие сцены
    case 1: key = "memory"; step = 30; break;  // еске алу / юбилей
    case 2: key = "edu";    step = 60; break;  // урок или подкаст
    case 3: key = "motion"; step = 10; break;  // моушн / ИИ-видео
    default: key = "other"; step = 30;
  }
  return { steps: t("plan." + key), step: step };
}

// if / else: срок зависит от длительности (1–2 дня, максимум 3)
function getDeadline(minutes) {
  if (minutes <= 3) {
    return t("plan.d1");
  } else if (minutes <= 10) {
    return t("plan.d2");
  } else {
    return t("plan.d3");
  }
}

// while: отметки таймлайна 0:00, 0:15, 0:30 … и конец ролика (не больше 8 отметок)
function buildTimeline(minutes, stepSec) {
  const total = Math.round(minutes * 60), marks = [];
  let sec = 0;
  while (sec < total && marks.length < 7) {
    marks.push(toTime(sec));
    sec = sec + stepSec;
  }
  if (sec < total) {
    marks.push("…");   // отметок много — показываем только начало и конец
  }
  marks.push(toTime(total));
  return marks;
}

function renderPlan(minutes) {
  const box = $("#cPlan");
  if (!box) return;
  const typeName = $("#cType").value;
  const plan = getVideoPlan($("#cType").selectedIndex);
  const marks = buildTimeline(minutes, plan.step);

  // for: этапы работы
  let stepsHtml = "";
  for (let i = 0; i < plan.steps.length; i++) {
    stepsHtml += "<li>" + plan.steps[i] + "</li>";
  }
  // for: отметки таймлайна
  let tlHtml = "";
  for (let i = 0; i < marks.length; i++) {
    tlHtml += "<span>" + marks[i] + "</span>";
  }

  box.innerHTML =
    '<div class="ptitle">' + getProjectTitle(typeName, String(minutes).replace(".", ",")) + "</div>" +
    '<div class="pmeta">' + t("plan.days") + ": <b>" + getDeadline(minutes) + "</b></div>" +
    '<div class="pk">' + t("plan.steps") + " (" + getStepCount(plan.steps) + ")</div>" +
    "<ol>" + stepsHtml + "</ol>" +
    '<div class="pk">' + t("plan.tl") + "</div>" +
    '<div class="tl">' + tlHtml + "</div>";
}

/* ---------- calculator ---------- */
function calc(){
  const m = parseFloat($("#cMin").value);
  $("#cMinOut").textContent = String(m).replace(".", ",");
  let per = CONFIG.pricePerMin + ($("#cSubs").checked ? CONFIG.subsPerMin : 0) + ($("#cVoice").checked ? CONFIG.voicePerMin : 0);
  const total = Math.max(CONFIG.minOrder, Math.round(per * m / 500) * 500);
  $("#cTotal").textContent = "≈ " + fmt(total);
  renderPlan(m);
  return total;
}
